retargeting:
  type: vector
  urdf_path: "g1_29dof_rev_1_0_with_inspire_hand_DFQ.urdf"
  wrist_link_name: "L_hand_base_link"
  low_pass_alpha: 0.2
  scaling_factor: 1.0

  # Vector retargeting: defines pairs of (origin, task) links on the robot.
  # Each pair forms a direction vector that is matched to the corresponding
  # human hand direction vector defined by target_link_human_indices.

  # Origin links (start of each vector on the robot)
  target_origin_link_names:
    - "L_hand_base_link"    # Thumb vector origin
    - "L_hand_base_link"    # Index vector origin
    - "L_hand_base_link"    # Middle vector origin
    - "L_hand_base_link"    # Ring vector origin
    - "L_hand_base_link"    # Pinky vector origin

  # Task links (end of each vector on the robot — fingertips)
  target_task_link_names:
    - "L_thumb_distal"       # Thumb tip
    - "L_index_intermediate" # Index tip
    - "L_middle_intermediate"# Middle tip
    - "L_ring_intermediate"  # Ring tip
    - "L_pinky_intermediate" # Pinky tip

  # MediaPipe landmark indices for human hand vectors
  # Shape must be (2, N): row 0 = origin indices, row 1 = task indices
  # 0=Wrist, 4=Thumb tip, 8=Index tip, 12=Middle tip, 16=Ring tip, 20=Pinky tip
  target_link_human_indices:
    - [0, 0, 0, 0, 0]      # Origins: all Wrist
    - [4, 8, 12, 16, 20]   # Tasks: Thumb, Index, Middle, Ring, Pinky tips
